<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Universal Controller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        h1 {
            margin: 0;
        }

        main {
            width: 80%;
            max-width: 900px;
            margin: 30px auto;
        }

        .configuration {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);

            margin-bottom: 25px;
        }

        .configuration h2 {
            margin-top: 0;
        }

        .selection {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        .remapping {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .remapping h2 {
            margin-top: 0;
        }

        .remap-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 12px;

            border-bottom: 1px solid #ddd;
        }

        .remap-row:last-child {
            border-bottom: none;
        }

        .physical-button {
            font-weight: bold;
            width: 30%;
        }

        .arrow {
            width: 10%;
            text-align: center;
        }

        .output-button {
            width: 50%;
        }

        .button-container {
            margin-top: 25px;
            text-align: center;
        }

        button {
            padding: 12px 20px;
            margin: 5px;

            font-size: 16px;

            border: none;
            border-radius: 5px;

            cursor: pointer;
        }

        #applyButton {
            background-color: #222;
            color: white;
        }

        #applyButton:hover {
            background-color: #444;
        }

        #resetButton {
            background-color: #ccc;
        }

        #resetButton:hover {
            background-color: #aaa;
        }

        #status {
            margin-top: 20px;

            padding: 15px;

            background-color: #e8f5e9;

            border-radius: 5px;

            display: none;
        }

    </style>

// Apply the selected controller configuration.
        function applySettings() {
            const controller = document.getElementById("controllerType").value;
            const consoleType = document.getElementById("consoleType").value;
			
			switch (controller){
				case "Nintendo Switch Pro Controller":
					if (consoleType == "Nintendo Switch"){
						 defaultMappings = defaultSwitch;
						 jsonTitle = 'defaultSwitch.json';
						 jsonChoice = defaultSwitchJson;
						 }
					else if (consoleType == "PlayStation 5"){
						 defaultMappings = switchToPlaystation;
						 jsonTitle = 'switchToPlaystation.json';
						 jsonChoice = switchToPlaystationJson;
						 }
					else{
						 defaultMappings = switchToXbox;
						 jsonTitle = 'switchToXbox.json';
						 jsonChoice = switchToXboxJson;
						 }
					break;
				case "Xbox One":
					if (consoleType == "Nintendo Switch"){
						 defaultMappings = xboxToSwitch;
						 jsonTitle = 'xboxToSwitch.json';
						 jsonChoice = xboxToSwitchJson;
						 }
					else if (consoleType == "PlayStation 5"){
						 defaultMappings = xboxToPlaystation;
						 jsonTitle = 'xboxToPlaystation.json';
						 jsonChoice = xboxToPlaystationJson;
						 }
					else{
						 defaultMappings = defaultXboxMappings;
						 jsonTitle = 'defaultXbox.json';
						 jsonChoice = defaultXboxJson;
						 }
					break;
				case "DualShock":
					if (consoleType == "Nintendo Switch"){
						 defaultMappings = dualshockToSwitch;
						 jsonTitle = 'dualshockToSwitch.json';
						 jsonChoice = dualshockToSwitchJson;
						 }
					else if (consoleType == "PlayStation 5"){
						 defaultMappings = defaultDualshockMappings;
						 jsonTitle = 'defaultDualshock.json';
						 jsonChoice = defaultDualshockJson;
						 }
					else{
						 defaultMappings = dualshockToXbox;
						 jsonTitle = 'dualshockToXbox.json';
						 jsonChoice = dualshockToXboxJson;
						 }
					/*break;
				default:
					if (consoleType == "Nintendo Switch")
					else if (consoleType == "Playstation 5")
					else*/
			}
            // Use the selected controller/console mapping directly.
            // The editable remapping dropdowns are disabled in the HTML.
            const mappings = { ...defaultMappings };

            // Display current configuration.
            let message = "<strong>Configuration Applied!</strong><br><br>";
            message += "Controller: " + controller + "<br>";
            message += "Console: " + consoleType + "<br><br>";
            message += "<strong>Input Mappings:</strong><br>";

            for (let button in mappings) {
                message += button + " → " + mappings[button] + "<br>";
            }

            const status = document.getElementById("status");
            status.innerHTML = message;
            status.style.display = "block";
			
			//create and download a json file
			const jsonString = JSON.stringify(jsonChoice, null, 2);

			const blob = new Blob([jsonString], { type: "application/json" });
			const url = URL.createObjectURL(blob);

			const downloadLink = document.createElement('a');
			downloadLink.href = url;
			downloadLink.download = jsonTitle; 
			document.body.appendChild(downloadLink);
			downloadLink.click();
			document.body.removeChild(downloadLink);
			URL.revokeObjectURL(url);
        }


        // Reset the displayed results. Apply Choices will show the current defaults again.
        function resetMappings() {
            document.getElementById("status").style.display = "none";
        }

        function initializePage() {
            // Remapping controls are disabled; mappings appear after Apply Choices.
        }


        // Creates the input remapping rows.
        function createRemappingRows() {
            const remappingArea = document.getElementById("remappingArea");

            // Clear the remapping area.
            remappingArea.innerHTML = "";
            
            // Loop through every physical button.
            for (let physicalButton in defaultMappings) {
                const row = document.createElement("div");
                row.className = "remap-row";

                // Physical button name
                const physical = document.createElement("div");
                physical.className = "physical-button";
                physical.textContent = physicalButton;

                // Arrow
                const arrow = document.createElement("div");
                arrow.className = "arrow";
                arrow.textContent = "→";

                // Dropdown containing possible outputs
                const select = document.createElement("select");
                select.className = "output-button";

                // Create option for all possible controller input.
                for (let outputButton of Object.values(defaultMappings)) {
					const option = document.createElement("option");

					option.value = outputButton;
					option.textContent = outputButton;

					if (outputButton === defaultMappings[physicalButton]) {
						option.selected = true;
					}

					select.appendChild(option);
				}

                // Add everything to the row.
                row.appendChild(physical);
                row.appendChild(arrow);
                row.appendChild(select);
                remappingArea.appendChild(row);
            }

        }


        
    </script>
</head>

<body onload="initializePage()">
    <header>
        <h1>Universal Controller</h1>
        <p>
            Configure your controller and customize
            your button mappings.
        </p>
    </header>

    <main>
        <!--
        Controller/Console Configuration
        -->
        <section class="configuration">
            <h2>Controller Configuration</h2>
            <div class="selection">
                <label for="controllerType">
                    Controller Type
                </label>
                <select id="controllerType">
                    <option value="Xbox One">
                        Xbox One
                    </option>

                    <option value="DualShock">
                        DualShock
                    </option>

                    <option value="Nintendo Switch Pro Controller">
                        Nintendo Switch Pro Controller
                    </option>

                    <!--<option value="Keyboard and Mouse">
                        Keyboard and Mouse
                    </option>-->
                </select>
            </div>

            <div class="selection">
                <label for="consoleType">
                    Console Type
                </label>
                <select id="consoleType">
                    <option value="Xbox One">
                        Xbox One
                    </option>

                    <option value="PlayStation 5">
                        PlayStation 5
                    </option>

                    <option value="Nintendo Switch">
                        Nintendo Switch
                    </option>
                </select>
            </div>
			
        </section>

        <!--
        Input Remapping
        -->
        <!--
        Input Remapping controls are temporarily disabled.
        The applied input mappings are still displayed below the configuration section.

        <section class="remapping">
            <h2>Input Remapping</h2>
            <p>
                Select what each physical button should
                output to the console.
            </p>

            <div id="remappingArea"></div>

            <div class="button-container">
                <button onclick="applySettings()">
                    Apply Remapping
                </button>

                <button onclick="resetMappings()">
                    Reset to Default
                </button>
            </div>
        </section>
        -->
        <section class="remapping">
		<div class="button-container">

                <button
                    id="applyButton"
                    onclick="applySettings()">
                    Apply Choices
                </button>

                <button
                    id="resetButton"
                    onclick="resetMappings()">
                    Reset to Default
                </button>
            </div>
            <div id="status"></div>
        </section>
    </main>
    <noscript>
        This website requires JavaScript to run.
    </noscript>

</body>

</html>
