<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Universal Controller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        h1 {
            margin: 0;
        }

        main {
            width: 80%;
            max-width: 900px;
            margin: 30px auto;
        }

        .configuration {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);

            margin-bottom: 25px;
        }

        .configuration h2 {
            margin-top: 0;
        }

        .selection {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        .remapping {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .remapping h2 {
            margin-top: 0;
        }

        .remap-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 12px;

            border-bottom: 1px solid #ddd;
        }

        .remap-row:last-child {
            border-bottom: none;
        }

        .physical-button {
            font-weight: bold;
            width: 30%;
        }

        .arrow {
            width: 10%;
            text-align: center;
        }

        .output-button {
            width: 50%;
        }

        .button-container {
            margin-top: 25px;
            text-align: center;
        }

        button {
            padding: 12px 20px;
            margin: 5px;

            font-size: 16px;

            border: none;
            border-radius: 5px;

            cursor: pointer;
        }

        #applyButton {
            background-color: #222;
            color: white;
        }

        #applyButton:hover {
            background-color: #444;
        }

        #resetButton {
            background-color: #ccc;
        }

        #resetButton:hover {
            background-color: #aaa;
        }

        #status {
            margin-top: 20px;

            padding: 15px;

            background-color: #e8f5e9;

            border-radius: 5px;

            display: none;
        }

    </style>
    <script>
        /*
         * Default controller button mappings
         *
         * The key on the left is the physical button.
         * The value on the right is what the controller will tell the console was pressed.
         */
        const defaultMappings = {

            "A": "A",
            "B": "B",
            "X": "X",
            "Y": "Y",

            "Left Bumper": "Left Bumper",
            "Right Bumper": "Right Bumper",

            "Left Stick": "Left Stick",
            "Right Stick": "Right Stick",
			
			"Left Trigger": "Left Trigger",
            "Right Trigger": "Right Trigger",

            "D-Pad Up": "D-Pad Up",
            "D-Pad Down": "D-Pad Down",
            "D-Pad Left": "D-Pad Left",
            "D-Pad Right": "D-Pad Right",

            "Start": "Start",
            "Select": "Select"
        };
		const defaultXboxMappings = {
		
			"A": "A",
            "B": "B",
            "X": "X",
            "Y": "Y",

            "Left Bumper": "Left Bumper",
            "Right Bumper": "Right Bumper",

            "Left Stick": "Left Stick",
            "Right Stick": "Right Stick",

            "D-Pad Up": "D-Pad Up",
            "D-Pad Down": "D-Pad Down",
            "D-Pad Left": "D-Pad Left",
            "D-Pad Right": "D-Pad Right",

            "Start": "Start",
            "Select": "Select"
        };
		const defaultDualshockMappings = {
		
			"X": "X",
            "O": "O",
            "Triangle": "Triange",
            "Square": "Square",

            "L1": "L1",
            "R1": "R1",

            "L3": "L3",
            "R3": "R3",

            "D-Pad Up": "D-Pad Up",
            "D-Pad Down": "D-Pad Down",
            "D-Pad Left": "D-Pad Left",
            "D-Pad Right": "D-Pad Right",

            "Options": "Options",
            "Share": "Share"
        };

        function initializePage() {
            createRemappingRows();
        }


        // Creates the input remapping rows.
        function createRemappingRows() {
            const remappingArea = document.getElementById("remappingArea");

            // Clear the remapping area.
            remappingArea.innerHTML = "";
            
            // Loop through every physical button.
            for (let physicalButton in defaultMappings) {
                const row = document.createElement("div");
                row.className = "remap-row";

                // Physical button name
                const physical = document.createElement("div");
                physical.className = "physical-button";
                physical.textContent = physicalButton;

                // Arrow
                const arrow = document.createElement("div");
                arrow.className = "arrow";
                arrow.textContent = "→";

                // Dropdown containing possible outputs
                const select = document.createElement("select");
                select.className = "output-button";

                // Create option for all possible controller input.
                for (let outputButton in defaultMappings) {
                    const option = document.createElement("option");
                    option.value = outputButton;
                    option.textContent = outputButton;

                    // Select default mapping.
                    if (outputButton === physicalButton) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                }

                // Add everything to the row.
                row.appendChild(physical);
                row.appendChild(arrow);
                row.appendChild(select);
                remappingArea.appendChild(row);
            }

        }


        // Apply the selected controller configuration.
        function applySettings() {
            const controller = document.getElementById("controllerType").value;
            const consoleType = document.getElementById("consoleType").value;

            // Get all of the remapping dropdowns.
            const remappingSelects = document.querySelectorAll(".output-button");
            let mappings = {};
            
            // Store each physical button's selected output.
            let physicalButtons = Object.keys(defaultMappings);

            for (let i = 0; i < remappingSelects.length; i++) {
                mappings[physicalButtons[i]] = remappingSelects[i].value;
            }

            // Display current configuration.
            let message = "<strong>Configuration Applied!</strong><br><br>";
            message += "Controller: " + controller + "<br>";
            message += "Console: " + consoleType + "<br><br>";
            message += "<strong>Input Mappings:</strong><br>";

            for (let button in mappings) {
                message += button + " → " + mappings[button] + "<br>";
            }

            const status = document.getElementById("status");
            status.innerHTML = message;
            status.style.display = "block";
        }


        // Reset all mappings to default.
        function resetMappings() {
            createRemappingRows();
            document.getElementById("status").style.display = "none";
        }
    </script>
</head>

<body onload="initializePage()">
    <header>
        <h1>Universal Controller</h1>
        <p>
            Configure your controller and customize
            your button mappings.
        </p>
    </header>

    <main>
        <!--
        Controller/Console Configuration
        -->
        <section class="configuration">
            <h2>Controller Configuration</h2>
            <div class="selection">
                <label for="controllerType">
                    Controller Type
                </label>
                <select id="controllerType">
                    <option value="Xbox One">
                        Xbox One
                    </option>

                    <option value="DualShock">
                        DualShock
                    </option>

                    <option value="Nintendo Switch Pro Controller">
                        Nintendo Switch Pro Controller
                    </option>

                    <option value="Keyboard and Mouse">
                        Keyboard and Mouse
                    </option>
                </select>
            </div>

            <div class="selection">
                <label for="consoleType">
                    Console Type
                </label>
                <select id="consoleType">
                    <option value="Xbox One">
                        Xbox One
                    </option>

                    <option value="PlayStation 5">
                        PlayStation 5
                    </option>

                    <option value="Nintendo Switch">
                        Nintendo Switch
                    </option>
                </select>
            </div>
			<div class="button-container">

                <button
                    id="applyButton"
                    onclick="applySettings()">
                    Apply Choices
                </button>

                <button
                    id="resetButton"
                    onclick="resetMappings()">
                    Reset to Default
                </button>
            </div>
        </section>

        <!--
        Input Remapping
        -->
        <section class="remapping">
            <h2>Input Remapping</h2>
            <p>
                Select what each physical button should
                output to the console.
            </p>

            <div id="remappingArea">

                <!--
                JavaScript will eventually create the remapping controls here when we get to that stage.
                -->

            </div>

            <div class="button-container">

                <button
                    id="applyButton"
                    onclick="applySettings()">
                    Apply Remapping
                </button>

                <button
                    id="resetButton"
                    onclick="resetMappings()">
                    Reset to Default
                </button>
            </div>
            <div id="status"></div>
        </section>
    </main>
    <noscript>
        This website requires JavaScript to run.
    </noscript>

</body>

</html>
