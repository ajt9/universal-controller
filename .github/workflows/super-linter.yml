name: Lint Code Base

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  run-lint:
    name: Lint Code Base
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Super-Linter needs full git history to check changed files
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@v7
        env:
          VALIDATE_ALL_CODEBASE: false # Only lints modified files on PRs
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
